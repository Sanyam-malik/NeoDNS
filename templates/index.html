<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NeoDNS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div id="spinner-overlay" class="d-none">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <div class="container">
        <h1 class="mb-4">NeoDNS</h1>

        <!-- Resolvers Section -->
        <div class="mb-5">
            <h2>Resolvers</h2>
            <ul id="resolver-list" class="list-group mb-3"></ul>
            <div id="resolver-alert" class="alert alert-warning d-none" role="alert">
                This resolver already exists. Please delete the existing resolver to add a new one.
            </div>
            <div class="input-group mb-3">
                <input type="text" id="new-resolver" class="form-control" placeholder="e.g. 8.8.4.4" />
                <button class="btn btn-primary" onclick="addResolver()">Add Resolver</button>
            </div>
        </div>

        <!-- Domains Section -->
        <div class="mb-5">
            <h2>Domains</h2>
            <div class="accordion mb-3" id="domainAccordion"></div>
            <div class="mb-4">
                <div id="domain-alert" class="alert alert-warning d-none" role="alert">
                    This domain already exists. Please delete the existing domain to add a new one.
                </div>
                <div class="input-group mb-3">
                    <input type="text" id="domain-name" class="form-control" placeholder="Domain name (e.g. example.com)" />
                    <input type="text" id="domain-ip" class="form-control" placeholder="IP/Host (e.g. 192.168.1.1)" />
                    <button class="btn btn-success" onclick="addOrUpdateDomain()">Add Domain</button>
                </div>
            </div>
        </div>

        <div class="card my-4">
            <div class="card-body">
                <h5 class="card-title">DNS Lookup</h5>
                <div class="input-group mb-3">
                    <input type="text" id="digDomainInput" class="form-control" placeholder="Enter domain e.g. google.com">
                    <button class="btn btn-primary" onclick="performDig()">Lookup</button>
                </div>
                <pre id="digOutput" class="bg-dark text-white p-3 rounded d-none" style="max-height: 400px; overflow-y: auto;"></pre>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
