version: '3.8'

services:
  neodns:
    build: .
    container_name: neodns
    ports:
      - "53:1053/udp"
      - "80:8000"
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    restart: always
    networks:
      - neodns_network

networks:
  neodns_network:
    driver: bridge