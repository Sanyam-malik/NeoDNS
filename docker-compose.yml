version: '3.8'

services:
  neodns:
    build: .
    container_name: neodns
    ports:
      - "53:53/udp"  # Map UDP port 53 for DNS queries
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
    restart: always
    networks:
      - neodns_network

networks:
  neodns_network:
    driver: bridge
