name: Build Docker Image and Upload to Gitea Asset

on:
  push:
    branches:
      - mains

jobs:
  build:
    name: Build Docker Image and Upload

    steps:
      - name: Adding NeoDNS Server
        run: |
          echo "nameserver 10.60.1.2" > /etc/resolv.conf
          echo "nameserver 8.8.8.8" >> /etc/resolv.conf

      - name: Set up environment and install required packages
        run: |
          apt update
          apt install -y git docker.io jq curl iputils-ping

      - name: Ping Available Services
        run: |
          ping -c 4 forgejo.maxim.com
          ping -c 4 unleash.maxim.com
          ping -c 4 kafka.maxim.com
          ping -c 4 postgres.maxim.com
          ping -c 4 mongodb.maxim.com
          ping -c 4 jenkins.maxim.com
          ping -c 4 minio.maxim.com
          ping -c 4 redis.maxim.com
          ping -c 4 sonar.maxim.com
          ping -c 4 keycloak.maxim.com
          ping -c 4 netflix.maxim.com
          ping -c 4 prometheus.maxim.com
          ping -c 4 jaeger.maxim.com
          ping -c 4 omv.maxim.com

      - name: Clone repository
        run: |
          git clone http://sammy:logonfire@forgejo.maxim.com/TW/DNS.git /DNS

      - name: Build Docker image
        run: |
          cd /DNS
          docker build -t neodns:latest .

      - name: Save Docker image as a tarball
        run: |
          docker save neodns:latest | gzip > /DNS/neodns.tar.gz

      - name: Upload Docker image tarball as Gitea release asset
        run: |
          echo 'Uploading Docker image tarball as Gitea release asset...'
          
          # Inline variable assignments (replace with your actual values)
          GITEA_ACCESS_TOKEN='e4cf814b6413be70dbfb84b81306e9cceac2f63a'  # Replace with your Gitea token securely
          GITEA_API_URL='http://forgejo.maxim.com:3000/api/v1'
          GITEA_OWNER='Neo'  # Replace with your Gitea username or organization
          GITEA_REPO='DNS'  # Replace with your repository name
          REPO_DIR='/DNS'  # Replace with the correct directory path
          
          # Step 1: Fetch the latest release
          response=$(curl -s -H "Authorization: token ${GITEA_ACCESS_TOKEN}" \
            "${GITEA_API_URL}/repos/${GITEA_OWNER}/${GITEA_REPO}/releases")
          
          echo "Raw response from Gitea: ${response}"
          
          # Step 2: Check if there are any releases
          releaseExists=$(echo "${response}" | jq '. | length')
          
          echo "Number of releases found: ${releaseExists}"
          
          if [ "${releaseExists}" == "0" ]; then
            # No releases found, start from version 1.0
            newVersion="1.0"
            echo "No releases found, starting from version ${newVersion}"
          else
            # Get the latest version tag from the response (assuming semantic versioning)
            latestVersion=$(echo "${response}" | jq -r '.[0].tag_name')
            echo "Latest release version: ${latestVersion}"
          
            # Step 3: Increment the version number
            IFS='.' read -r major minor patch <<< "${latestVersion}"
            minor=$((minor + 1))
          
            # Set new version
            newVersion="${major}.${minor}"
          
            echo "New version to be created: ${newVersion}"
          fi
          
          # Step 4: Create a new release with the determined version
          releaseCreateResponse=$(curl -X POST -H "Authorization: token ${GITEA_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${newVersion}\", \"name\": \"${newVersion}\", \"body\": \"Release version ${newVersion}\"}" \
            "${GITEA_API_URL}/repos/${GITEA_OWNER}/${GITEA_REPO}/releases")
          
          echo "Release creation response: ${releaseCreateResponse}"
          
          # Step 5: Check if the release creation was successful
          releaseId=$(echo "${releaseCreateResponse}" | jq '.id')
          
          echo "Release ID: ${releaseId}"
          
          # Step 6: Upload the Docker image tarball as an asset if release creation was successful
          if [ "${releaseId}" != "null" ]; then
            curl -X POST -H "Authorization: token ${GITEA_ACCESS_TOKEN}" \
              -F "attachment=@${REPO_DIR}/neodns.tar.gz" \
              "${GITEA_API_URL}/repos/${GITEA_OWNER}/${GITEA_REPO}/releases/${releaseId}/assets?name=neodns.tar.gz"
          else
            echo "Error: Failed to create release or retrieve Release ID." && exit 1
          fi
